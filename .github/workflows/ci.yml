name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calabrain
          POSTGRES_PASSWORD: calabrain
          POSTGRES_DB: calabrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calabrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # S3-compatible test server for uploads and document jobs.
      - run: pip install "moto[server]" && (moto_server -H 127.0.0.1 -p 9100 > /tmp/moto.log 2>&1 &)
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://calabrain:calabrain@localhost:5432/calabrain_test
          TEST_WORKER_DATABASE_URL: postgres://calabrain:calabrain@localhost:5432/calabrain_worker_test
      - run: pnpm --filter @calabrain/web build
